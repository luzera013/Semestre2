    <style type="text/tailwindcss">
        @layer utilities {
            @keyframes fade {
                0% {opacity: 0;}
                100% {opacity: 1;}
            }
            @keyframes wiggle {
                0%, 100% {transform: rotate(-3deg);}
                50% {transform: rotate(3deg);}
            }
            .animate-fade {
                animation: fade 1s ease-in-out infinite;
            }
            .animate-wiggle {
                animation: wiggle 0.5s ease-in-out infinite;
            }
        }

    </style>
</head>

<body class="m-4">

    <button class="bg-red-500 hover:bg-red-700 text-white py-2 px-4 rounded transition duration-500 ease-in-out">Clique no Suave</button>

    <div class="w-10 h-10 bg-blue-500 animate-spin m-8">CP</div>

    <div class="p-4 bg-green-300 rounded w-20 animate-fade">Fede</div>

    <button class="animate-wiggle mt-4">Treme</button>

    <div class="animate-wiggle w-40 h-40 bg-green-500 rounded-full mt-4">Treme</div>

    <div class="animate-fade w-40 h-40 bg-yellow-500 mt-4"></div>
